<script type="application/json" id="article-search-index">[
{% for item in site.articles %}

    "type": "article",

    "url": {{ item.url | relative_url | jsonify }},

    "category": {{ item.categories | first | default: "article" | jsonify }},
    "excerpt": {{ item.content | split: '</h1>' | last | strip_html | normalize_whitespace | truncate: 180 | jsonify }},

  },
{% endfor %}
